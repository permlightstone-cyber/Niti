<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#08101c" />
  <meta name="description" content="Нити — живая линия всей жизни" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Нити</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="brand">Нити</div>
        <div class="subtitle">Линия жизни</div>
      </div>
      <button id="profileBtn" class="ghost">Профиль</button>
    </header>

    <section class="filters" id="filters">
      <button class="chip active" data-layer="threads">Нити</button>
      <button class="chip active" data-layer="events">События</button>
      <button class="chip active" data-layer="plans">Планы</button>
      <button class="chip active" data-layer="finance">Финансы</button>
      <button class="chip active" data-layer="activity">Активность</button>
    </section>

    <section class="timeline-card">
      <div class="timeline-head">
        <div>
          <b id="scaleTitle">Вся жизнь</b>
          <span id="scaleHint">масштабируй двумя пальцами</span>
        </div>
        <button id="resetView" class="ghost small">Сброс</button>
      </div>
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="lifeCanvas"></canvas>
        <div id="watermark" class="watermark"></div>
      </div>
      <div class="legend">
        <span><i class="line finance"></i> Финансы: − ниже / + выше</span>
        <span><i class="line activity"></i> Сон ниже / активность выше</span>
      </div>
    </section>

    <section class="actions">
      <button data-add="thread">+ Нить</button>
      <button data-add="event">+ Событие</button>
      <button data-add="plan">+ План</button>
      <button data-add="finance">+ Финансы</button>
      <button data-add="activity">+ Активность</button>
    </section>

    <section class="panel-grid">
      <div class="panel">
        <h3>События</h3>
        <div id="eventsList" class="list empty">Пока нет событий</div>
      </div>
      <div class="panel">
        <h3>Планы</h3>
        <div id="plansList" class="list empty">Пока нет планов</div>
      </div>
    </section>
  </main>

  <dialog id="modal">
    <form method="dialog" id="modalForm">
      <div class="modal-head">
        <b id="modalTitle">Добавить</b>
        <button value="cancel" class="ghost">✕</button>
      </div>
      <div id="modalFields"></div>
      <menu>
        <button value="cancel" class="ghost">Отмена</button>
        <button value="default" id="saveModal">Сохранить</button>
      </menu>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
